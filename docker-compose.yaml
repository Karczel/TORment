services:

  frontend:
    build:
      context: ./TORment-Frontend

    ports:
      - "3000:3000"

    volumes:
      - ./TORment-Frontend:/app
      - /app/node_modules

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001

    depends_on:
      - backend


  backend:
    build:
      context: ./csp-backend

    ports:
      - "5001:5000"

    volumes:
      - ./csp-backend:/app
      - /app/node_modules

    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/fullstack_db

    depends_on:
      mongo:
        condition: service_healthy


  mongo:
    image: mongo:8.0

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  mongo_data: